name: Publish container

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      # Only runtime inputs publish a new application image. Deployment,
      # documentation, test, and workflow-policy changes are verified by CI
      # but require an explicit workflow_dispatch if an image is needed.
      - "app.py"
      - "automation.py"
      - "config.py"
      - "favicon.py"
      - "icons.py"
      - "qr.py"
      - "routeros.py"
      - "security.py"
      - "store.py"
      - "templates.py"
      - "static/**"
      - "Containerfile"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Verify Node.js runtime
        run: node --version
      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check "pre-commit==4.3.0"
      - name: Run repository pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Check for committed secret patterns
        run: python scripts/check-secrets.py
      - name: Compile application
        run: python -m compileall -q app.py automation.py cloudflare.py deploy_routeros_canary.py deployment.py favicon.py icons.py install_routeros.py qr.py routeros.py security.py store.py templates.py update_routeros_app.py
      - name: Run unit and mock integration tests
        run: python -m unittest discover -s tests -v

  publish:
    name: Publish ${{ matrix.name }} image
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ARM64
            platform: linux/arm64
            suffix: arm64
          - name: AMD64
            platform: linux/amd64
            suffix: amd64
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Sign in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long,prefix=sha-,suffix=-${{ matrix.suffix }}
            type=raw,value=edge-${{ matrix.suffix }},enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=ref,event=tag,suffix=-${{ matrix.suffix }}
            type=sha,format=long,prefix=sha-,enable=${{ matrix.suffix == 'arm64' }}
            type=raw,value=edge,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && matrix.suffix == 'arm64' }}
            type=ref,event=tag,enable=${{ matrix.suffix == 'arm64' }}
      - name: Build and publish
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Containerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          # RouterOS 7 compatibility takes precedence: attached attestations can
          # turn a single-platform image into an OCI index RouterOS may not pull.
          sbom: false
          provenance: false
          cache-from: type=gha,scope=release-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.suffix }}
      - name: Record immutable digest
        run: |
          echo "### Published ${{ matrix.name }} container" >> "$GITHUB_STEP_SUMMARY"
          echo "- Platform: `${{ matrix.platform }}`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Architecture tag suffix: `${{ matrix.suffix }}`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Digest: \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke-test the published runtime
        shell: bash
        env:
          RELEASE_IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          docker pull --platform "$TARGET_PLATFORM" "$RELEASE_IMAGE"
          container_id="$(docker run --platform "$TARGET_PLATFORM" --detach "$RELEASE_IMAGE")"
          trap 'docker logs "$container_id" || true; docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            payload="$(docker exec "$container_id" wget -q -O - http://127.0.0.1:8080/readyz 2>/dev/null || true)"
            if printf '%s' "$payload" | grep -Fq '"status":"ready"'; then
              break
            fi
            sleep 1
          done
          test "${payload:-}" != ""
          printf '%s' "$payload" | grep -Fq '"revision":"${{ github.sha }}"'
          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$container_id")" = "${{ github.sha }}"
