name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Verify Node.js runtime
        run: node --version
      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check "pre-commit==4.3.0"
      - name: Run all repository hooks
        run: pre-commit run --all-files --show-diff-on-failure

  secret-patterns:
    name: Secret patterns
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Scan tracked text
        run: python scripts/check-secrets.py

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install audit tooling
        run: python -m pip install --disable-pip-version-check --requirement requirements-dev.txt
      - name: Audit shipped dependencies
        run: python -m pip_audit --strict --requirement requirements-runtime.txt --requirement requirements-redis.txt --requirement requirements-deploy.txt

  tests:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile application
        run: python -m compileall -q app.py automation.py cloudflare.py connection_doctor.py error_guidance.py exposure_doctor.py deploy_routeros_canary.py deployment.py event_safety.py favicon.py icons.py install_routeros.py integrations.py qr.py routeros.py security.py store.py templates.py update_routeros_app.py scripts/backup_sqlite.py scripts/certificate_lifecycle_acceptance.py scripts/collect_release_acceptance.py scripts/collect_rollback_acceptance.py scripts/release_acceptance.py scripts/redis_recovery_acceptance.py scripts/rollback_acceptance.py scripts/sqlite_restore_verifier.py scripts/stream_acceptance.py scripts/telemetry_acceptance.py scripts/telemetry_stream_observer.py
      - name: Install application runtime dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-runtime.txt
      - name: Run unit and mock integration tests
        run: python -m unittest discover -s tests -v

  redis-integration:
    name: Redis outbox recovery integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install the optional Redis client
        run: python -m pip install --disable-pip-version-check --requirement requirements-redis.txt
      - name: Install the Ubuntu Redis server
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends redis-server
          redis-server --version
      - name: Start Redis and verify readiness
        run: |
          sudo service redis-server start
          redis-cli -h 127.0.0.1 ping | grep -qx PONG
      - name: Verify live Redis review coordination
        env:
          REDIS_TEST_URL: redis://127.0.0.1:6379/0
        run: python -m unittest discover -s tests -p "test_redis_review_coordination.py" -v
      - name: Verify outbox outage recovery and duplicate semantics
        env:
          REDIS_TEST_URL: redis://127.0.0.1:6379/0
        run: python scripts/redis_recovery_acceptance.py --output redis-recovery-acceptance.json
      - name: Upload redacted source-bound Redis recovery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: redis-recovery-${{ github.sha }}
          path: redis-recovery-acceptance.json
          if-no-files-found: ignore
          retention-days: 7

  attest-redis-evidence:
    name: Attest Redis recovery evidence
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: redis-integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download redacted Redis recovery evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: redis-recovery-${{ github.sha }}
      - name: Attest redacted Redis recovery evidence
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: redis-recovery-acceptance.json

  socketio-security-contract:
    name: Socket.IO same-origin security contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install pinned application runtime dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-runtime.txt
      - name: Verify Engine.IO retains same-origin enforcement
        run: python -m unittest tests.test_asgi_contract -v

  browser-regression:
    name: Rendered browser and accessibility regression
    # Match the committed Chromium screenshots' Windows font rasterization.
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.11.1"
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install application runtime dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-runtime.txt
      - name: Install pinned browser test dependencies
        run: npm ci
      - name: Install pinned Playwright Chromium
        run: npx playwright install chromium
      - name: Run visual and accessibility regressions
        run: npm run test:browser
      - name: Upload browser report and failure artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-regression-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  arm64-build:
    name: ARM64 image build
    needs: [secret-patterns, tests, redis-integration]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/arm64
          push: false
          load: true
          tags: local/mikrotik-openvpn-gui:ci
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            INSTALL_REDIS=true
          cache-from: type=gha,scope=ci-arm64
          cache-to: type=gha,mode=max,scope=ci-arm64
          sbom: false
          provenance: false
      - name: Scan ARM64 candidate image for OS and library vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/mikrotik-openvpn-gui:ci
          format: table
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL
          timeout: 10m0s
      - name: Smoke-test the ARM64 runtime
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker run --platform linux/arm64 --health-interval=1s --detach local/mikrotik-openvpn-gui:ci)"
          trap 'docker inspect --format "{{json .State.Health}}" "$container_id" || true; docker logs "$container_id" || true; docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 120); do
            payload="$(docker exec "$container_id" wget -q -O - http://127.0.0.1:8080/readyz 2>/dev/null || true)"
            if printf '%s' "$payload" | grep -Fq '"status":"ready"'; then
              break
            fi
            sleep 1
          done
          test "${payload:-}" != ""
          printf '%s' "$payload" | grep -Fq '"status":"ready"'
          if ! docker exec "$container_id" timeout -t 2 wget -q -T 2 -O /dev/null http://127.0.0.1:8080/readyz; then
            echo "Image healthcheck command failed after /readyz became ready"
            exit 1
          fi
          for attempt in $(seq 1 30); do
            health_status="$(docker inspect --format '{{.State.Health.Status}}' "$container_id")"
            if [ "$health_status" = "healthy" ]; then
              break
            fi
            sleep 1
          done
          test "${health_status:-}" = "healthy"
          runtime_uids="$(docker exec "$container_id" awk '/^Uid:/ { print $2, $3, $4, $5; exit }' /proc/1/status)"
          test "$runtime_uids" = "65534 65534 65534 65534"
          core_limits="$(docker exec "$container_id" cat /proc/1/limits)"
          printf '%s\n' "$core_limits" | awk '
            /^Max core file size/ {
              if ($5 == 0 && $6 == 0) found = 1
            }
            END { exit !found }
          '
          docker exec "$container_id" python3 -c 'import redis; print(redis.__version__)'
          printf '%s' "$payload" | grep -Fq '"revision":"${{ github.sha }}"'
          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$container_id")" = "${{ github.sha }}"
