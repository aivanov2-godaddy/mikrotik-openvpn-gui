name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Verify Node.js runtime
        run: node --version
      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check "pre-commit==4.3.0"
      - name: Run all repository hooks
        run: pre-commit run --all-files --show-diff-on-failure

  secret-patterns:
    name: Secret patterns
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Scan tracked text
        run: python scripts/check-secrets.py

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install audit tooling
        run: python -m pip install --disable-pip-version-check --requirement requirements-dev.txt
      - name: Audit shipped dependencies
        run: python -m pip_audit --strict --requirement requirements-runtime.txt --requirement requirements-redis.txt --requirement requirements-deploy.txt

  tests:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile application
        run: python -m compileall -q app.py automation.py cloudflare.py connection_doctor.py error_guidance.py exposure_doctor.py deploy_routeros_canary.py deployment.py event_safety.py favicon.py icons.py install_routeros.py integrations.py qr.py routeros.py security.py store.py templates.py update_routeros_app.py scripts/backup_sqlite.py
      - name: Run unit and mock integration tests
        run: python -m unittest discover -s tests -v

  redis-integration:
    name: Redis outbox recovery integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install the optional Redis client
        run: python -m pip install --disable-pip-version-check --requirement requirements-redis.txt
      - name: Install the Ubuntu Redis server
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends redis-server
          redis-server --version
      - name: Verify outbox outage recovery and duplicate semantics
        env:
          REDIS_TEST_URL: redis://127.0.0.1:6379/0
        run: python -m unittest tests.test_redis_integration -v

  socketio-security-contract:
    name: Socket.IO same-origin security contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install pinned application runtime dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-runtime.txt
      - name: Verify Engine.IO retains same-origin enforcement
        run: python -m unittest tests.test_asgi_contract -v

  browser-regression:
    name: Rendered browser and accessibility regression
    # Match the committed Chromium screenshots' Windows font rasterization.
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.11.1"
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install application runtime dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-runtime.txt
      - name: Install pinned browser test dependencies
        run: npm ci
      - name: Install pinned Playwright Chromium
        run: npx playwright install chromium
      - name: Run visual and accessibility regressions
        run: npm run test:browser
      - name: Upload browser report and failure artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-regression-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  arm64-build:
    name: ARM64 image build
    needs: [secret-patterns, tests, redis-integration]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/arm64
          push: false
          load: true
          tags: local/mikrotik-openvpn-gui:ci
          build-args: |
            VERSION=ci
            REVISION=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            INSTALL_REDIS=true
          cache-from: type=gha,scope=ci-arm64
          cache-to: type=gha,mode=max,scope=ci-arm64
          sbom: false
          provenance: false
      - name: Smoke-test the ARM64 runtime
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker run --platform linux/arm64 --detach local/mikrotik-openvpn-gui:ci)"
          trap 'docker logs "$container_id" || true; docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            payload="$(docker exec "$container_id" wget -q -O - http://127.0.0.1:8080/readyz 2>/dev/null || true)"
            if printf '%s' "$payload" | grep -Fq '"status":"ready"'; then
              break
            fi
            sleep 1
          done
          test "${payload:-}" != ""
          docker exec "$container_id" python3 -c 'import redis; print(redis.__version__)'
          printf '%s' "$payload" | grep -Fq '"revision":"${{ github.sha }}"'
          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$container_id")" = "${{ github.sha }}"
