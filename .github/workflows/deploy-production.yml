name: Deploy production to RouterOS

on:
  workflow_run:
    workflows: ["Publish container"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: Full commit SHA whose immutable image should be deployed
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-routeros-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Pull and run immutable image on RouterOS
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    # The RouterOS REST endpoint is private. This job must run on the
    # repository-scoped management runner inside the trusted network.
    runs-on: [self-hosted, Windows, X64, routeros-private]
    timeout-minutes: 25
    environment:
      name: production
    defaults:
      run:
        # The runner's interactive profile is user-managed and may shadow
        # built-in PowerShell commands. Deployments must be deterministic.
        shell: pwsh -NoProfile -command ". '{0}'"
    env:
      RELEASE_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.commit || github.event.workflow_run.head_sha }}
      ROUTEROS_REST_URL: ${{ secrets.ROUTEROS_REST_URL }}
      ROUTEROS_DEPLOY_USERNAME: ${{ secrets.ROUTEROS_DEPLOY_USERNAME }}
      ROUTEROS_DEPLOY_PASSWORD: ${{ secrets.ROUTEROS_DEPLOY_PASSWORD }}
      ROUTEROS_CONTAINER_NAME: ${{ secrets.ROUTEROS_CONTAINER_NAME }}
      ROUTEROS_REST_CA_B64: ${{ secrets.ROUTEROS_REST_CA_B64 }}
    steps:
      - name: Check out the exact published commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_COMMIT }}
      - name: Validate runner Python
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (& python --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^Python 3\.(1[0-9])(?:\.|$)') {
            throw "The private runner must provide Python 3.10 or newer; detected: $version"
          }
          Write-Host "Using $version from the private runner"
      - name: Validate deployment inputs
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_COMMIT -notmatch '^[0-9a-f]{40}$') {
            Write-Error 'The release commit must be a full lowercase SHA'
          }
          foreach ($name in @('ROUTEROS_REST_URL', 'ROUTEROS_DEPLOY_USERNAME', 'ROUTEROS_DEPLOY_PASSWORD', 'ROUTEROS_CONTAINER_NAME', 'ROUTEROS_REST_CA_B64')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value)) {
              Write-Error "Missing production secret $name"
            }
          }
          $caDir = Join-Path $env:RUNNER_TEMP 'routeros'
          New-Item -ItemType Directory -Path $caDir -Force | Out-Null
          $caPath = Join-Path $caDir 'routeros-ca.crt'
          [IO.File]::WriteAllBytes($caPath, [Convert]::FromBase64String($env:ROUTEROS_REST_CA_B64))
          if ((Get-Item -LiteralPath $caPath).Length -le 0) {
            Write-Error 'RouterOS REST CA certificate is empty'
          }
      - name: Pull, update, start, and health-gate RouterOS container
        env:
          RELEASE_IMAGE: ghcr.io/${{ github.repository }}:sha-${{ env.RELEASE_COMMIT }}
        run: |
          $ErrorActionPreference = 'Stop'
          $caPath = Join-Path $env:RUNNER_TEMP 'routeros/routeros-ca.crt'
          $env:ROUTEROS_REST_CA_PEM = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes($caPath))
          python scripts/deploy_routeros_release.py
      - name: Write deployment summary
        run: |
          @"
          ### RouterOS production deployment
          - Commit: ``$env:RELEASE_COMMIT``
          - Image: ``ghcr.io/${{ github.repository }}:sha-$env:RELEASE_COMMIT``
          - RouterOS container: ``$env:ROUTEROS_CONTAINER_NAME``
          - Strategy: in-place immutable image update with automatic rollback on start failure
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
