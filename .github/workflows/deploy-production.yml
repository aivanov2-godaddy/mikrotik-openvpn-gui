name: Deploy production to RouterOS

on:
  workflow_run:
    workflows: ["Publish container"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: Full commit SHA whose immutable image should be deployed
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-routeros-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Pull and run immutable image on RouterOS
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
    env:
      RELEASE_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.commit || github.event.workflow_run.head_sha }}
      ROUTEROS_REST_URL: ${{ secrets.ROUTEROS_REST_URL }}
      ROUTEROS_DEPLOY_USERNAME: ${{ secrets.ROUTEROS_DEPLOY_USERNAME }}
      ROUTEROS_DEPLOY_PASSWORD: ${{ secrets.ROUTEROS_DEPLOY_PASSWORD }}
      ROUTEROS_CONTAINER_NAME: ${{ secrets.ROUTEROS_CONTAINER_NAME }}
      ROUTEROS_REST_CA_B64: ${{ secrets.ROUTEROS_REST_CA_B64 }}
    steps:
      - name: Check out the exact published commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_COMMIT }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Validate deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The release commit must be a full lowercase SHA"; exit 1
          fi
          for name in ROUTEROS_REST_URL ROUTEROS_DEPLOY_USERNAME ROUTEROS_DEPLOY_PASSWORD ROUTEROS_CONTAINER_NAME ROUTEROS_REST_CA_B64; do
            if [[ -z "${!name}" ]]; then echo "::error::Missing production secret $name"; exit 1; fi
          done
          mkdir -p "$RUNNER_TEMP/routeros"
          printf '%s' "$ROUTEROS_REST_CA_B64" | base64 --decode > "$RUNNER_TEMP/routeros/routeros-ca.crt"
          chmod 600 "$RUNNER_TEMP/routeros/routeros-ca.crt"
          test -s "$RUNNER_TEMP/routeros/routeros-ca.crt"
      - name: Pull, update, start, and health-gate RouterOS container
        env:
          RELEASE_IMAGE: ghcr.io/${{ github.repository }}:sha-${{ env.RELEASE_COMMIT }}
        shell: bash
        run: |
          set -euo pipefail
          export ROUTEROS_REST_CA_PEM="$(base64 --decode < "$RUNNER_TEMP/routeros/routeros-ca.crt")"
          python scripts/deploy_routeros_release.py
      - name: Write deployment summary
        run: |
          {
            echo "### RouterOS production deployment"
            echo "- Commit: `$RELEASE_COMMIT`"
            echo "- Image: `ghcr.io/${{ github.repository }}:sha-$RELEASE_COMMIT`"
            echo "- RouterOS container: `$ROUTEROS_CONTAINER_NAME`"
            echo "- Strategy: in-place immutable image update with automatic rollback on start failure"
          } >> "$GITHUB_STEP_SUMMARY"
