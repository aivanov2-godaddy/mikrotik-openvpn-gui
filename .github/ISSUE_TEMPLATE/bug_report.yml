name: Bug report
description: Report a reproducible problem using mock or redacted data
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, tokens, private keys, profile files, production exports, or unredacted screenshots. Use a private security advisory for vulnerabilities.
  - type: textarea
    id: result
    attributes:
      label: What happened?
      description: Describe the visible result and the result you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give the shortest safe sequence using mock or redacted values.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Commit SHA or immutable image tag; never include a credential.
    validations:
      required: true
  - type: input
    id: routeros
    attributes:
      label: RouterOS version and architecture
      placeholder: 7.x / arm64
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Safe diagnostics
      description: Include only sanitized browser, application, or RouterOS observations.
  - type: checkboxes
    id: privacy
    attributes:
      label: Data safety
      options:
        - label: I removed secrets and identifying production data.
          required: true
