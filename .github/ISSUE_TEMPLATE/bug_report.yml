name: Bug report
description: Report a reproducible problem with the dashboard or integrations
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, tokens, private keys, profile files, production exports, or unredacted screenshots. Use a private security advisory for vulnerabilities.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and the behavior you expected.
      placeholder: The dashboard shows …, but I expected …
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give the shortest safe sequence using mock or redacted values.
      placeholder: |
        1. Open …
        2. Select …
        3. Observe …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Dashboard UI
        - RouterOS integration
        - VPN profile or device onboarding
        - Authentication or authorization
        - Updates or deployment
        - Reports, audit, or observability
        - Documentation
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Commit SHA or immutable image tag; never include a credential.
      placeholder: sha-COMMIT-ARCHITECTURE
    validations:
      required: true
  - type: input
    id: routeros
    attributes:
      label: RouterOS version and architecture
      placeholder: 7.x / arm64
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Safe diagnostics
      description: Include only sanitized browser, application, or RouterOS observations.
      placeholder: Redacted error text, status indicators, and non-secret timestamps.
  - type: checkboxes
    id: privacy
    attributes:
      label: Data safety
      options:
        - label: I removed secrets and identifying production data.
          required: true
