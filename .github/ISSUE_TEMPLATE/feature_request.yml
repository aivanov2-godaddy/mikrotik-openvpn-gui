name: Feature request
description: Propose a focused operator or VPN-user improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Keep examples generic. Do not include credentials, private keys, real user data, production exports, or unredacted screenshots.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What operator or VPN-user problem should be easier or safer?
      placeholder: Today, an operator has to …, which causes …
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the simple user experience, not only an implementation.
      placeholder: A user should be able to … and see …
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Primary scope
      options:
        - Dashboard UI
        - RouterOS integration
        - Profile onboarding
        - Security or access policy
        - Operations and observability
        - Build or deployment
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable behaviors that would make this request complete.
      placeholder: |
        - [ ] …
        - [ ] …
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workaround or alternative design you evaluated.
  - type: textarea
    id: risk
    attributes:
      label: Security and rollback considerations
      description: Note credential, certificate, routing, data, or compatibility impact.
  - type: checkboxes
    id: privacy
    attributes:
      label: Data safety
      options:
        - label: This request contains no secrets or unredacted production data.
          required: true
