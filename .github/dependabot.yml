version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Sofia
    rebase-strategy: auto
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: "/"
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Europe/Sofia
    versioning-strategy: increase
    rebase-strategy: auto
    open-pull-requests-limit: 3
    groups:
      python-runtime:
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      python-tooling:
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: "/"
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Europe/Sofia
    rebase-strategy: auto
    open-pull-requests-limit: 3
    groups:
      docker-images:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
